aid: unicorn-auctions
name: Unicorn Auctions
description: >-
  Unicorn Auctions is a Chicago-based online auction marketplace for rare spirits and
  fine wine, founded in 2019 by A.J. Heindel, Cody Modeer and Phil Mikhaylov out of the
  city's restaurant and bar trade. Every lot is sold on consignment: Unicorn
  authenticates, appraises, photographs and digitizes each bottle before listing it in
  one to three weekly online auctions that can carry several thousand lots spanning
  bourbon, scotch, Japanese whisky, tequila, agave spirits and wine. The company also
  runs a bonded vault storage service for collectors, and publishes The Unicorn Review,
  an editorial and auction-intelligence blog. Bidding is entirely digital, through the
  web platform and native iOS and Android apps. Unicorn Auctions publishes no public
  developer program - no OpenAPI, SDK, webhook catalog or developer portal - and the
  api.unicornauctions.com backend that serves its own clients is private, undocumented
  and disallowed in robots.txt.
